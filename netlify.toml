[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

# app.prospektor.ai is retired (operator decision, 18 Aug 2026). It served the
# pre-pivot agency page — apply, 90 days, $25k — which is not something
# Prospektor sells any more. The subdomain keeps resolving on purpose: old
# links, email signatures and search results should land on the product that
# does exist rather than on a 404.
[[redirects]]
  from = "https://app.prospektor.ai/*"
  to = "https://prospektor.ai/"
  status = 301
  force = true

[[redirects]]
  from = "/app/*"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# The studio sets these on every response and this site set none — found by
# running the board-versus-product pass against studio.prospektor.ai and
# noticing the sibling was stricter. It matters more here than there: this is
# the origin with the buy form, and a page that can be framed is a page that
# can be clickjacked into a click the visitor thinks lands somewhere else.
# Same values as the studio, deliberately — one policy, two properties.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# A wildcard on the static font files. It was added when app.prospektor.ai
# loaded them cross-origin; that subdomain is gone and the studio serves its
# own fonts now, so nothing depends on this today — kept because it is
# harmless on public font files and the long cache header beside it is not.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000"