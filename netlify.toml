# Server-side env vars the functions expect (set in the Netlify UI, never in code):
#   SENDGRID_API_KEY         send-brief.js, stripe-webhook.js (welcome email)
#   STRIPE_SECRET_KEY        create-checkout.js
#   STRIPE_PRICE_ID          create-checkout.js
#   STRIPE_CHECKOUT_MODE     create-checkout.js (optional; 'payment' default, or 'subscription')
#   STRIPE_WEBHOOK_SECRET    stripe-webhook.js (endpoint: /.netlify/functions/stripe-webhook)
#   STUDIO_PROVISION_SECRET  stripe-webhook.js — must match the studio's PROVISION_SECRET
[build]
  command = "npm run build"
  publish = "_site"
  functions = "netlify/functions"

[[redirects]]
  from = "https://app.prospektor.ai/*"
  to = "/app/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

# app.prospektor.ai loads the fonts from this origin, so they need CORS
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"
    Cache-Control = "public, max-age=31536000"